apiVersion: apps/v1
kind: Deployment
metadata: 
  name: job
  labels:
    app: job
spec: 
  replicas: 1
  template:
    metadata:
      name: job
      labels:
        app: job
    spec:
      containers:
        - name: job
          image: chandana28121998/jobms:latest  
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILE_ACTIVE
              value: k8s
      restartPolicy: Always
  selector:
    matchLabels:
      app: job